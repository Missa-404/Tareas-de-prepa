<body>
        <style>
            @import url('https://fonts.cdnfonts.com/css/i-ilmu-script');
            @import url('https://fonts.cdnfonts.com/css/kingsmen');
            :root{
                --salmon: #f08e7aff;
                --ghost-white: #f6f6fdff;
                --alice-blue: #d7e6edff;
                --tiffany-blue: #7fdcc8ff;
                --yinmn-blue: #324d71ff;
            }

            *{
              margin: 0;
              padding: 0;
              box-sizing: border-box;
            }
            body{
                background-color: var(--yinmn-blue);
                font-family: 'Kingsmen', sans-serif;
                color: var(--ghost-white);
                display: grid;
                justify-content: center;
                padding: 20px;
                flex-direction: column;
                align-items: center;
            }

            .calc{
              width: 33%;
              height: 70%;
             background-color: var(--yinmn-blue);
             position: absolute;
             border: 5px solid black;
             border-radius: 20px;

            }

            #ans{
              width: 400px;
              height: 50px;
              align-content: center;
              margin-top: 20px;
              font-family: 'Times New Roman', Times, serif;
              font-size: 20px;
              color: var(--salmon);
              text-align: center;
              border-radius: 15px;
            }

            .btn input[type='button']{
              width: 70px;
              padding: 2px;
              margin: 4px;
              position: relative;
              left: 23px;
              top: 20px;
              height: 55px;
              cursor: pointer;
              font-size: 16px;
              transition: all 0.5s ease;
              background-color: var(--tiffany-blue);
              border-radius: 6px;
            }

            .btn input[type='button']:hover{
              background-color: var(--alice-blue);
              color: var(--yinmn-blue);
            }

    
            
           
        </style>
    
        <nav class="navbar navbar-light" style="background-color: var(--salmon);">

                <a class="navbar-brand" href="index.html" style="background: var(--tiffany-blue);">Inicio</a>

                               <a  class="dropdown-item" href="./index.html">Proteccion</a><br>
    
                            </div>
                        
                    </li>
                </ul>
    
                <ul class="nav navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="unidad2.html" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="color: var(--tiffany-blue);">Unidad 2</a>
                            <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                             <a  class="dropdown-item" href="./file4.html">Calculadora</a><br>
                              <a  class="dropdown-item" href="./tabla2.html">Ataques</a><br>
                               <a  class="dropdown-item" href="./index.html">Proteccion</a><br>
    
                            </div>
                        
                    </li>

                <ul class="nav navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="unidad1.html" id="navbarDropdownMenuLink" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="color: var(--tiffany-blue);">Unidad 3</a>
                            <div class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                             <a  class="dropdown-item" href="./tabla.html">Conceptos</a><br>
                              <a  class="dropdown-item" href="./tabla2.html">Ataques</a><br>

                            </div>
                        
                    </li>
                </ul>
    
            </div>
            </div>
          </nav>
        </div>


        <div class="container">
      <div class="calc">
        <input type="text" id="ans">
        <div class="btn">
            <input type="button" value="C" onclick="Clear()">
            <input type="button" value="%" onclick="Solve('%')">
            <input type="button" value="←" onclick="Solve('←')">
            <input type="button" value="/" onclick="Solve('/')">
            <br>

            <input type="button" value="7" onclick="Solve('7')">
            <input type="button" value="8" onclick="Solve('8')">
            <input type="button" value="9" onclick="Solve('9')">
            <input type="button" value="x" onclick="Solve('x')">
            <br>

            <input type="button" value="4" onclick="Solve('4')">
            <input type="button" value="5" onclick="Solve('5')">
            <input type="button" value="6" onclick="Solve('6')">
            <input type="button" value="-" onclick="Solve('-')">
            <br>

            <input type="button" value="1" onclick="Solve('1')">
            <input type="button" value="2" onclick="Solve('2')">
            <input type="button" value="3" onclick="Solve('3')">
            <input type="button" value="+" onclick="Solve('+')">
            <br>

            <input type="button" value="00" onclick="Solve('00')">
            <input type="button" value="0" onclick="Solve('0')">
            <input type="button" value="." onclick="Solve('.')">
            <input type="button" value="=" onclick="Result()">
            <br>

        </div>
      </div>
        </div>
      <script type="text/javascript"> 
        const Solve = (val) =>{
            const v=document.getElementById('ans');
            v.value +=val;
        }

        const Result =() =>{
            const v1=document.getElementById('ans').value;
            const v2=eval(v1);
            document.getElementById('ans').value=v2;
        }
        const Clear = () =>{
            const input=document.getElementById('ans');
            input.value='';
        }

        const Back = () =>{
            const back=document.getElementById('ans');
            back.value=back.value.slice(0,-1);
        }
      </script>
