<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.cdnfonts.com/css/black-family" rel="stylesheet">

    <title>Peliculas</title>
    <style>
        .container{
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        h1{
            text-align: center;
            margin-top: 50px;
            margin-bottom: 30px;
            font-family: 'ShadowedBlack', sans-serif;
        }
        form{
            display: flex;
            justify-content:center;
            margin-bottom: 50px;
            font-family: 'IncisedBlack', sans-serif;
        }
        input[type="text"] {
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 5px;
            border: none;
            width: 50%;
        }
        input[type="submit"] {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            margin-left: 10px;
            cursor: pointer;
        }
           input[type="submit"]:hover {
               background-color: licorice;
               color: white
           }
           .movies {
               display: grid;
               grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
               grid-gap: 20px;
           }
           .movie {
               position: relative;
           }
           .movie img {
               width: 100%;
               height: auto;
               border-radius: 15px;
           }
           .movie-info{
            opacity: 0;
            transition: opacity 0.3s ease;
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
           }
           .movie:hover .movie-info{
            opacity: 1;
           }
           .movie-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
           }
           .movie-info span{
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
           }
           .green {
            color: #2ecc71;
           }
           .orange {
            color: #f1c40f;
           }
           .red {
            color: #e74c3c;
           }
           .overview {
            margin-top: 20px;
            padding: 10px;
            max-height: 60%;
            overflow-y: auto;
            text-align: left;
            width: 90%;
           }
    </style>
</head>
<body>
    <div class="container">
        <h1>Bienvenido a mi Pagina de peliculas</h1>
        <form id="form">
            <input type="text" id="search" placeholder="Busca una pelicula">
            <input type="submit" value="Buscar">
        </form>
        <section id="main" class="movies"></section>
    </div>
    <script>
        const API_URL = 'https://api.themoviedb.org/3/discover/movie?sort_by=popularity.desc&api_key=3fd2be6f0c70a2a598f084ddfb75487c&page=1';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w1280';
        const SEARCH_API = 'https://api.themoviedb.org/3/search/movie?api_key=3fd2be6f0c70a2a598f084ddfb75487c&query=';
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getMovies(API_URL);

        async function getMovies(url) {
            const res = await fetch(url);
            const data = await res.json();
            showMovies(data.results);
        }

        function showMovies(movies) {
            main.innerHTML = '';
            movies.forEach((movie) => {
                const { title, poster_path, vote_average, overview } = movie;
                const movieEL = document.createElement('div');
                movieEL.classList.add('movie');
                movieEL.innerHTML = `
                    <img src="${IMG_PATH + poster_path}" alt="${title}">
                    <div class="movie-info">
                        <h3>${title}</h3>
                        <span class="${getClassByRate(vote_average)}">${vote_average}</span>
                        <div class="overview">
                            <h3>Overview</h3>
                            ${overview}
                        </div>
                    </div>
                `;
                main.appendChild(movieEL);
            });
        }

        function getClassByRate(vote) {
            if (vote >= 8) {
                return 'green';
            } else if (vote >= 5) {
                return 'orange';
            } else {
                return 'red';
            }
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const searchTerm = search.value;
            if (searchTerm && searchTerm !== '') {
                getMovies(SEARCH_API + searchTerm);
                search.value = '';
            } else {
                window.location.reload();
            }
        });
    </script>
</body>
</html>
