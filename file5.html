    <!--Una API (interfaz de progrmacion de aplicaciones) es un conjunto de reglas y protocolos que permite a dos aplicaciones
    comunicarse entre si de forma estandarizada. Funciona como un intermediario que procesa solicitudes de datos o
    funcionalidades y devuelve una respuesta, permitiendo que aplicaciones como las redes socales o las apps del clima muestren
informacion de otros servicios sin tener que desarrollarlo desde cero.


Como funciona?
     solicitud: envia una solicitud a traqvez de la api pidiendo una accion o datos especificos. por ejemplo, tu app del clima
      solicita la temperatura actual a la api de un servicio meteorologico.
    
       procesamiento: la API de destino recibe la solicitud, la procesa (obtiene informacion solicitada o realiza la accion)
        y la procesa, generando una respuesta en un formato estandar.
       
        Respuesta: La API devuelve la respuesta a la aplicacion que hizo la solicitud. En el ejemplo del clima, la res´puesta seria la temperatura
        y otras revisiones meteorologicas-->
