<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Thieves</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #7b0000;
            color: white;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #4d0000;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #ff0000;
            margin: 10px 0;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: white;
            color: black;
            width: 200px;
            padding: 10px;
            
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            border-radius: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            color: black;
            padding: 20px;
            max-width: 600px;
            text-align: left;
            position: relative;
        }

        .close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 25px;
            color: red;
            cursor: pointer;
        }



    </style>
</head>

                description: "Detective príncipe y celebridad mediática con habilidades similares a Joker. Juega un papel complejo y crucial en la historia de los Phantom Thieves.",
                weapon: "Sables Láser y Rayos",
                role: "Comodín Rival"
            }
        ];

        const contenedor = document.getElementById('characters');
        const modal = document.getElementById('modal');
        const closeBtn = document.getElementById('closeBtn');
        const modalName = document.getElementById('modalName');
        const modalInfo = document.getElementById('modalInfo');

        personaData.forEach(p => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${p.portrait}" alt="${p.name}">
                <h3>${p.name} (${p.codename})</h3>
                <p>${p.description}</p>
                <button class="btn-detalles">Detalles</button>
            `;
            card.querySelector('.btn-detalles').addEventListener('click', () => showModal(p));
            contenedor.appendChild(card);
        });
        function showModal(char) {
            modalName.textContent = `${char.name} (${char.codename})`;
            modalInfo.innerHTML = `
                <div class="info-section"><span class="info-label">Arcana:</span> ${char.arcana}</div>
                <div class="info-section"><span class="info-label">Persona:</span> ${char.persona}</div>
                <div class="info-section"><span class="info-label">Arma:</span> ${char.weapon}</div>
                <div class="info-section"><span class="info-label">Rol:</span> ${char.role}</div>
                <div class="info-section"><span class="info-label">Descripción:</span> ${char.description}</div>
            `;
            modal.style.display = 'flex';
        }

        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = e => { if (e.target === modal) modal.style.display = 'none'; };
    </script>
